<!doctype html>
<html lang="en">

<head>
	<meta charset="UTF-8" />
	<link rel="icon" type="image/png" sizes="64x64" href="/favicon.png" />
	<link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />
	<meta name="theme-color" content="#0f1012" />
	<meta name="viewport" content="width=device-width, initial-scale=1.0" />
	<title>Plotstrand — Fictional Timelines</title>
	<meta name="description"
		content="Explore fictional universes through character appearances, events and visual timelines." />
	<script>
		(() => {
			const analyticsSetupUrl = new URL(window.location.href);
			if (analyticsSetupUrl.searchParams.get('plotstrand-analytics') === 'off') {
				try {
					window.localStorage.setItem('plotstrand.analyticsOptOut', 'true');
				} catch {
					// Analytics opt-out requires browser storage to be available.
				}

				const isAppleMobile = /iPhone|iPad|iPod/.test(navigator.userAgent) ||
					(navigator.platform === 'MacIntel' && navigator.maxTouchPoints > 1);
				// Keep the flag in the iOS home-screen app's launch URL so it can set its own storage.
				if (!isAppleMobile) {
					analyticsSetupUrl.searchParams.delete('plotstrand-analytics');
					history.replaceState(null, '', analyticsSetupUrl.pathname + analyticsSetupUrl.search + analyticsSetupUrl.hash);
				}
			}
		})();
	</script>
</head>

<body>
	<div id="root"></div>
	<script type="module" src="/src/main.tsx"></script>
</body>

</html>
